info:
  contact: {}
  description: API for the GoGym coaching platform.
  title: GoGym API
  version: "1.0"
paths:
  /api/v1/athletes:
    get:
      description: 'Lists the authenticated coach''s athletes, newest first. Defaults
        to private athletes only — the coach''s ongoing working list — since public
        athletes are one-off plan-link deliveries; pass athlete_type to widen that.
        Paginated: meta carries the total, limit and offset.'
      parameters:
      - description: Case-insensitive partial match on first or last name
        in: query
        name: q
        type: string
      - description: Which athletes to include; defaults to private
        enum:
        - private
        - public
        - all
        in: query
        name: athlete_type
        type: string
      - default: 20
        description: Page size, 1-100
        in: query
        name: limit
        type: integer
      - default: 0
        description: Rows to skip
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.SuccessEnvelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/internal_athlete.athleteResponse'
                  type: array
                meta:
                  $ref: '#/definitions/internal_athlete.listMeta'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: List athletes
      tags:
      - athletes
    post:
      consumes:
      - application/json
      description: Adds an athlete to the authenticated coach's roster. The owning
        coach comes from the bearer token — a coach_id in the body is ignored. Omitting
        athlete_type creates a private athlete.
      parameters:
      - description: Athlete details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_athlete.createRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/internal_athlete.athleteResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Create an athlete
      tags:
      - athletes
  /api/v1/athletes/{id}:
    get:
      description: Returns the athlete's full profile. An athlete that belongs to
        another coach is reported as not found, the same as one that doesn't exist.
      parameters:
      - description: Athlete ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/internal_athlete.athleteResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Get an athlete
      tags:
      - athletes
  /api/v1/athletes/{id}/measurements:
    get:
      description: 'Returns every measurement for the athlete, oldest first, ready
        to plot as a trend chart. Not paginated: one check-in per visit stays small.
        An athlete with no measurements yields an empty array; an athlete that belongs
        to another coach is reported as not found.'
      parameters:
      - description: Athlete ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.SuccessEnvelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/internal_measurement.measurementResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: List measurements
      tags:
      - measurements
    post:
      consumes:
      - application/json
      description: Records one check-in for the athlete. date is required (YYYY-MM-DD);
        every metric is optional, but at least one must be given. Weight is in kilograms,
        circumferences in centimetres. An athlete that belongs to another coach is
        reported as not found.
      parameters:
      - description: Athlete ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Measurement values
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_measurement.createRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/internal_measurement.measurementResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Add a measurement
      tags:
      - measurements
  /api/v1/athletes/{id}/plans:
    get:
      description: 'Returns every plan for the athlete, newest start_date first. At
        most one plan has is_current true: the latest one whose start_date is today
        or earlier. A plan starting in the future is upcoming, not current, and if
        every plan starts in the future none is current. Not paginated. An athlete
        with no plans yields an empty array; an athlete that belongs to another coach
        is reported as not found.'
      parameters:
      - description: Athlete ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.SuccessEnvelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/internal_plan.planSummaryResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: List an athlete's plans
      tags:
      - plans
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Verifies phone + password and returns a signed JWT. The error is
        the same whether the phone or the password was wrong.
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_coach.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/internal_coach.loginResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
      summary: Log in a coach
      tags:
      - auth
  /api/v1/auth/signup:
    post:
      consumes:
      - application/json
      description: Creates a coach account. v1 is single-coach, so this is open with
        no admin gate.
      parameters:
      - description: Signup details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_coach.signupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/internal_coach.coachResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
      summary: Sign up a coach
      tags:
      - auth
  /api/v1/blocks/{id}/movements:
    post:
      consumes:
      - application/json
      description: 'Adds every movement in the array to the block, or none of them.
        Send two or more to build a superset in one call. Each entry needs movement_id
        and order_in_block (0-999); reps (1-1000), duration_seconds (1-14400) and
        load (free text, e.g. "70kg", "75% 1RM", "RPE 8", "bodyweight") are optional.
        Every movement_id must be in the coach''s library: their own movements or
        a universal one. A movement that isn''t, or any other invalid entry, rejects
        the whole batch with a 400 whose fields are keyed by array position, e.g.
        "[1].movement_id". The response lists the created movements with their library
        name and category. A block whose plan''s athlete belongs to another coach
        is reported as not found.'
      parameters:
      - description: Block ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Movements to add, in one batch
        in: body
        name: request
        required: true
        schema:
          items:
            $ref: '#/definitions/internal_plan.addMovementRequest'
          type: array
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.SuccessEnvelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/internal_plan.blockMovementResponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Add movements to a block
      tags:
      - plans
  /api/v1/coaches/me:
    get:
      description: Returns the profile of the coach identified by the bearer token.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/internal_coach.coachResponse'
              type: object
        "401":
          description: Unauthorized
