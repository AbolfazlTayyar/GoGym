info:
  contact: {}
  description: API for the GoGym coaching platform.
  title: GoGym API
  version: "1.0"
paths:
  /api/v1/athletes:
    get:
      description: 'Lists the authenticated coach''s athletes, newest first. Defaults
        to private athletes only — the coach''s ongoing working list — since public
        athletes are one-off plan-link deliveries; pass athlete_type to widen that.
        Paginated: meta carries the total, limit and offset.'
      parameters:
      - description: Case-insensitive partial match on first or last name
        in: query
        name: q
        type: string
      - description: Which athletes to include; defaults to private
        enum:
        - private
        - public
        - all
        in: query
        name: athlete_type
        type: string
      - default: 20
        description: Page size, 1-100
        in: query
        name: limit
        type: integer
      - default: 0
        description: Rows to skip
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_platform_httpx.SuccessEnvelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/internal_athlete.athleteResponse'
                  type: array
                meta:
                  $ref: '#/definitions/internal_athlete.listMeta'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_platform_httpx.ValidationErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_platform_httpx.UnauthorizedEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_platform_httpx.InternalErrorEnvelope'
      security:
      - BearerAuth: []
      summary: List athletes
      tags:
      - athletes
    post:
      consumes:
      - application/json
      description: Adds an athlete to the authenticated coach's roster. The owning
        coach comes from the bearer token — a coach_id in the body is ignored. Omitting
        athlete_type creates a private athlete.
      parameters:
      - description: Athlete details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_athlete.athleteRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_platform_httpx.SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/internal_athlete.athleteResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_platform_httpx.ValidationErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_platform_httpx.UnauthorizedEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_platform_httpx.InternalErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Create an athlete
      tags:
      - athletes
  /api/v1/athletes/{id}:
    delete:
      description: Soft-deletes the athlete; data is null on success. Afterwards the
        athlete is gone from the list and from GET /athletes/{id}, and their plans
        and measurements are reported as not found. Nothing else is deleted. An athlete
        that belongs to another coach is reported as not found, the same as one that
        doesn't exist.
      parameters:
      - description: Athlete ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_platform_httpx.NoContentEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_platform_httpx.UnauthorizedEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_platform_httpx.NotFoundEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_platform_httpx.InternalErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Delete an athlete
      tags:
      - athletes
    get:
      description: Returns the athlete's full profile. An athlete that belongs to
        another coach is reported as not found, the same as one that doesn't exist.
      parameters:
      - description: Athlete ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_platform_httpx.SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/internal_athlete.athleteResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_platform_httpx.UnauthorizedEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_platform_httpx.NotFoundEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_platform_httpx.InternalErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Get an athlete
      tags:
      - athletes
    put:
      consumes:
      - application/json
      description: 'Replaces every editable field under the same rules as create:
        an optional field left out is cleared. athlete_type is required here, unlike
        on create, so an edit that forgets it can''t move a public athlete to private.
        An athlete that belongs to another coach is reported as not found, the same
        as one that doesn''t exist.'
      parameters:
      - description: Athlete ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Athlete details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_athlete.athleteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_platform_httpx.SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/internal_athlete.athleteResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_platform_httpx.ValidationErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_platform_httpx.UnauthorizedEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_platform_httpx.NotFoundEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_platform_httpx.InternalErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Update an athlete
      tags:
      - athletes
  /api/v1/athletes/{id}/measurements:
    get:
      description: 'Returns every measurement for the athlete, oldest first, ready
        to plot as a trend chart. Not paginated: one check-in per visit stays small.
        An athlete with no measurements yields an empty array; an athlete that belongs
        to another coach is reported as not found.'
      parameters:
      - description: Athlete ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_platform_httpx.SuccessEnvelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/internal_measurement.measurementResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_platform_httpx.UnauthorizedEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_platform_httpx.NotFoundEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_platform_httpx.InternalErrorEnvelope'
      security:
      - BearerAuth: []
      summary: List measurements
      tags:
      - measurements
    post:
      consumes:
      - application/json
      description: Records one check-in for the athlete. date is required (YYYY-MM-DD),
        no earlier than 2000-01-01 and no later than tomorrow in UTC; every metric
        is optional, but at least one must be given. Weight is in kilograms, circumferences
        in centimetres. An athlete that belongs to another coach is reported as not
        found.
      parameters:
      - description: Athlete ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Measurement values
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_measurement.measurementRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_platform_httpx.SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/internal_measurement.measurementResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_platform_httpx.ValidationErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_platform_httpx.UnauthorizedEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_platform_httpx.NotFoundEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_platform_httpx.InternalErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Add a measurement
      tags:
      - measurements
  /api/v1/athletes/{id}/plans:
    get:
      description: 'Returns every plan for the athlete, newest start_date first. At
        most one plan has is_current true: the latest one whose start_date is today
        or earlier. A plan starting in the future is upcoming, not current, and if
        every plan starts in the future none is current. Each plan carries its day_labels
        in day order ([] for an empty plan) and its block_count: the numbered lines
        across all its days, where a superset counts once. Warm-up and cool-down blocks
        count too, until a rule for telling them apart is decided. Not paginated.
        An athlete with no plans yields an empty array; an athlete that belongs to
        another coach is reported as not found.'
      parameters:
      - description: Athlete ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_platform_httpx.SuccessEnvelope'
