      tags:
      - auth
  /api/v1/days/{id}/blocks:
    post:
      consumes:
      - application/json
      description: 'Adds a block to the day. order_index (0-999) and sets (1-50) are
        required; rest_seconds (0-3600) and notes are optional. A block is the superset
        unit: add its movements, one or several, with the block movements endpoint.
        The response is the new block with an empty movements array. A day whose plan''s
        athlete belongs to another coach is reported as not found.'
      parameters:
      - description: Day ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Block details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_plan.addBlockRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/internal_plan.blockResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Add a block to a day
      tags:
      - plans
  /api/v1/movements:
    get:
      description: Lists the authenticated coach's own movements together with the
        universal, system-seeded ones, ordered by name. A universal movement has a
        null coach_id and is read-only. Filters combine with AND; an unknown muscle_group
        or equipment value is a 400, not an empty list. Not paginated.
      parameters:
      - description: Case-insensitive partial match on name
        in: query
        name: q
        type: string
      - description: Only movements for this primary muscle group
        enum:
        - chest
        - back
        - shoulders
        - arms
        - legs
        - core
        - full_body
        in: query
        name: muscle_group
        type: string
      - description: Only movements using this equipment
        enum:
        - bodyweight
        - barbell
        - dumbbell
        - kettlebell
        - machine
        - cable
        - band
        - other
        in: query
        name: equipment
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.SuccessEnvelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/internal_movement.movementResponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: List movements
      tags:
      - movements
    post:
      consumes:
      - application/json
      description: Adds a movement owned by the authenticated coach. The owner comes
        from the bearer token — a coach_id in the body is ignored. name is required
        (at most 100 characters); category (at most 50), description (at most 2000),
        muscle_group and equipment are optional. muscle_group and equipment are matched
        case-insensitively and stored lowercase.
      parameters:
      - description: Movement details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_movement.movementRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/internal_movement.movementResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Create a movement
      tags:
      - movements
  /api/v1/movements/{id}:
    delete:
      description: Removes one of the authenticated coach's own movements from the
        library; data is null on success. Plans that already use it are left intact
        and keep showing it, but it can no longer be added to a block. A universal
        movement is a 403; another coach's movement is reported as not found, the
        same as one that doesn't exist.
      parameters:
      - description: Movement ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.SuccessEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Delete a movement
      tags:
      - movements
    put:
      consumes:
      - application/json
      description: 'Replaces every editable field of one of the authenticated coach''s
        own movements, under the same rules as create: an optional field left out
        is cleared. media_url is not editable and is kept. A universal movement is
        a 403; another coach''s movement is reported as not found, the same as one
        that doesn''t exist.'
      parameters:
      - description: Movement ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Movement details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_movement.movementRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/internal_movement.movementResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Update a movement
      tags:
      - movements
  /api/v1/plans:
    post:
      consumes:
      - application/json
      description: Creates an empty plan for the athlete; add days, blocks and movements
        to it with the builder endpoints. athlete_id, start_date (YYYY-MM-DD) and
        title are required, note is optional. The response has the plan detail shape
        with an empty days array. An athlete that belongs to another coach is reported
        as not found.
      parameters:
      - description: Plan details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_plan.createRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/internal_plan.planDetailResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Create a plan
      tags:
      - plans
  /api/v1/plans/{id}:
    get:
      description: 'Returns the plan with its full nested tree in one response: days
        ordered by order_index (at most 7), each day''s blocks ordered by order_index,
        and each block''s movements ordered by order_in_block with the movement library''s
        name and category inlined. A block is the superset unit: a single movement
        and a superset have the same shape, differing only in the length of movements.
        Empty levels are empty arrays, never null. A plan whose athlete belongs to
        another coach is reported as not found.'
      parameters:
      - description: Plan ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/internal_plan.planDetailResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Get a plan with its days, blocks and movements
      tags:
      - plans
  /api/v1/plans/{id}/days:
    post:
      consumes:
      - application/json
      description: 'Adds a day to the plan. label must be one of A-G or day1-day7.
        order_index is the day''s slot, 0-6: a plan holds at most 7 days, one per
        slot, so a slot outside 0-6 or one another day already uses is a 400 on order_index.
        The response is the new day with an empty blocks array. A plan whose athlete
        belongs to another coach is reported as not found.'
      parameters:
      - description: Plan ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Day details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_plan.addDayRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/internal_plan.dayResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Add a day to a plan
      tags:
      - plans
  /healthz:
    get:
      description: Reports whether the service and its database connection are healthy.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_server.healthzOKResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/internal_server.healthzErrorResponse'
      summary: Health check
      tags:
      - health
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and a JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
