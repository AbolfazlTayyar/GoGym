basePath: /
definitions:
  github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorBody:
    properties:
      code:
        description: Code is one of the Code* constants; clients branch on it, unlike
          Message.
        example: validation_failed
        type: string
      fields:
        additionalProperties:
          type: string
        description: Fields is set for request-validation failures only.
        type: object
      message:
        description: Message is human-readable and may change freely.
        example: invalid request
        type: string
    type: object
  github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope:
    properties:
      data: {}
      error:
        $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorBody'
      success:
        example: false
        type: boolean
    type: object
  github_com_AbolfazlTayyar_gogym_internal_httpx.SuccessEnvelope:
    properties:
      data: {}
      error: {}
      meta: {}
      success:
        example: true
        type: boolean
    type: object
  internal_coach.coachResponse:
    properties:
      first_name:
        example: Ada
        type: string
      id:
        example: b8f1c9de-8f0a-4c1e-9a2b-2f6b6b8e2b3a
        type: string
      last_name:
        example: Lovelace
        type: string
      phone:
        example: "09372144430"
        type: string
    type: object
  internal_coach.loginRequest:
    properties:
      password:
        example: correct-horse-battery-staple
        type: string
      phone:
        example: "09372144430"
        type: string
    required:
    - password
    - phone
    type: object
  internal_coach.loginResponse:
    properties:
      token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  internal_coach.signupRequest:
    properties:
      first_name:
        example: Ada
        type: string
      last_name:
        example: Lovelace
        type: string
      password:
        example: correct-horse-battery-staple
        minLength: 8
        type: string
      phone:
        example: "09372144430"
        type: string
    required:
    - first_name
    - last_name
    - password
    - phone
    type: object
  internal_server.healthzErrorResponse:
    properties:
      reason:
        example: failed to connect to database
        type: string
      status:
        example: unavailable
        type: string
    type: object
  internal_server.healthzOKResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
info:
  contact: {}
  description: API for the GoGym coaching platform.
  title: GoGym API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Verifies phone + password and returns a signed JWT. The error is
        the same whether the phone or the password was wrong.
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_coach.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/internal_coach.loginResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
      summary: Log in a coach
      tags:
      - auth
  /api/v1/auth/signup:
    post:
      consumes:
      - application/json
      description: Creates a coach account. v1 is single-coach, so this is open with
        no admin gate.
      parameters:
      - description: Signup details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_coach.signupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/internal_coach.coachResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
      summary: Sign up a coach
      tags:
      - auth
  /api/v1/coaches/me:
    get:
      description: Returns the profile of the coach identified by the bearer token.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/internal_coach.coachResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_AbolfazlTayyar_gogym_internal_httpx.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Get the authenticated coach
      tags:
      - auth
  /healthz:
    get:
      description: Reports whether the service and its database connection are healthy.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_server.healthzOKResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/internal_server.healthzErrorResponse'
      summary: Health check
      tags:
      - health
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and a JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
