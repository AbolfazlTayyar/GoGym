  /api/v1/blocks/{id}/movements:
    post:
      consumes:
      - application/json
      description: 'Adds every movement in the array to the block, or none of them.
        Send two or more to build a superset in one call. Each entry needs movement_id
        and order_in_block (0-999); reps (1-1000), duration_seconds (1-14400) and
        load (free text, e.g. "70kg", "75% 1RM", "RPE 8", "bodyweight") are optional.
        Every movement_id must be in the coach''s library: their own movements or
        a universal one. A movement that isn''t, or any other invalid entry, rejects
        the whole batch with a 400 whose fields are keyed by array position, e.g.
        "[1].movement_id". The response lists the created movements with their library
        name and category. A block whose plan''s athlete belongs to another coach
        is reported as not found.'
