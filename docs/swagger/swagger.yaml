  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Verifies phone + password and sets the signed JWT as an httpOnly
        cookie (gogym_auth, Path=/api/v1, SameSite=Strict, Secure outside development)
        that the browser sends on every later call. The token is not in the body,
        so page scripts can't read it. The error is the same whether the phone or
        the password was wrong.
