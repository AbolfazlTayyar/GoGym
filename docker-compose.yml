services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DB_HOST: db
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # BusyBox wget, since the runtime image has no curl; $$ defers to the container's SERVER_PORT.
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:$$SERVER_PORT/healthz"]
      interval: 10s
      # Above the handler's 3s DB ping timeout, so a down database reports as unhealthy, not a hang.
      timeout: 5s
      retries: 3
      start_period: 10s

  migrate:
    # Same version as golang-migrate in go.mod.
    image: migrate/migrate:v4.20.1
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=${DB_SSLMODE}"
      - "up"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
